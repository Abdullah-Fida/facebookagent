name: Daily Facebook Auto Poster

on:
  schedule:
    # This runs the script at 2:30 AM, 8:00 AM, and 3:30 PM UTC
    # Which corresponds to 7:30 AM, 1:00 PM, and 8:30 PM Pakistan Standard Time (PKT)
    - cron: '30 2 * * *'
    - cron: '0 8 * * *'
    - cron: '30 15 * * *'
  
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Auto Poster Bot
      env:
        # We pull these securely from GitHub Secrets
        OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        BING_COOKIE: ${{ secrets.BING_COOKIE }}
        # Default fallback values for other variables (can also be put in secrets)
        POSTS_PER_DAY: 1
      run: |
        # Run the script once and automatically exit so GitHub Actions completes successfully
        python github_action_post.py
